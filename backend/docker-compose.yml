version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: nest-drizzle-postgres
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: simple_crud
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
